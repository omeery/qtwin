[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qtwin"
version = "0.1.0"
description = "Phase 0 foundation for the Quantum Processor Digital Twin: Lindblad open quantum dynamics and IBM Quantum characterization."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Quantum Digital Twin Contributors" },
]
dependencies = [
    "qutip>=5.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "qiskit>=1.1",
    "qiskit-ibm-runtime>=0.34.0",
    "qiskit-experiments>=0.7",
    "qiskit-aer>=0.14",
    "python-dotenv>=1.0",
    "stim>=1.13",
    "pymatching>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
